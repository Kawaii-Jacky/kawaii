<text x="160.0" y="386.0" font-size="16" fill="#1F2933" text-anchor="middle" font-weight="600" font-style="normal" opacity="1.0">Q　醌</text>
<text x="160.0" y="410.0" font-size="13" fill="#6B7280" text-anchor="middle" font-weight="400" font-style="normal" opacity="1.0">非芳香 · 强亲电 · 黄橙色</text>
<text x="450.0" y="386.0" font-size="16" fill="#6C3FC5" text-anchor="middle" font-weight="600" font-style="normal" opacity="1.0">Q•⁻　半醌自由基</text>
<text x="450.0" y="410.0" font-size="13" fill="#6B7280" text-anchor="middle" font-weight="400" font-style="normal" opacity="1.0">单电子还原态 · 未成对电子在环上离域</text>
<text x="740.0" y="386.0" font-size="16" fill="#2E7D32" text-anchor="middle" font-weight="600" font-style="normal" opacity="1.0">QH₂　氢醌</text>
<text x="740.0" y="410.0" font-size="13" fill="#6B7280" text-anchor="middle" font-weight="400" font-style="normal" opacity="1.0">芳香性已赎回 · 无色或浅色</text>
<text x="450.0" y="440.0" font-size="13" fill="#B26A00" text-anchor="middle" font-weight="400" font-style="normal" opacity="1.0">向右＝还原（把芳香性买回来）；向左＝氧化（重新把芳香性花掉）</text>
