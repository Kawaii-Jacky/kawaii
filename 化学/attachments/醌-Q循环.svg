<svg xmlns="http://www.w3.org/2000/svg" width="900" height="604" viewBox="0 0 900 604" font-family="Segoe UI, Microsoft YaHei, Helvetica, Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2933"/></marker><marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D6FD1"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker></defs>
<rect width="900" height="604" fill="#FDFCF9"/>
<text x="24.0" y="36.0" font-size="20" fill="#1F2933" text-anchor="start" font-weight="600" font-style="normal" opacity="1.0">Q 循环：一个氢醌，两个方向，四份质子</text>
<text x="24.0" y="62.0" font-size="13" fill="#6B7280" text-anchor="start" font-weight="400" font-style="normal" opacity="1.0">复合物 III（bc₁）一次周转中，分叉反应如何把 2e⁻ 换成跨膜质子梯度</text>
<rect x="0" y="215" width="900" height="190" fill="#E7EEF7" opacity="0.95"/>
<line x1="0.00" y1="215.00" x2="900.00" y2="215.00" stroke="#93A8BD" stroke-width="1.6" stroke-linecap="round"/>
<line x1="0.00" y1="405.00" x2="900.00" y2="405.00" stroke="#93A8BD" stroke-width="1.6" stroke-linecap="round"/>
<text x="20.0" y="205.0" font-size="13" fill="#1D6FD1" text-anchor="start" font-weight="600" font-style="normal" opacity="1.0">膜间隙（P 侧，H⁺ 浓度高）</text>
<text x="20.0" y="428.0" font-size="13" fill="#1D6FD1" text-anchor="start" font-weight="600" font-style="normal" opacity="1.0">线粒体基质（N 侧，H⁺ 浓度低）</text>
<rect x="250" y="160" width="400" height="290" rx="12" fill="#F4F7FB" stroke="#7C8FA3" stroke-width="1.8"/>
<text x="450.0" y="188.0" font-size="14" fill="#1F2933" text-anchor="middle" font-weight="600" font-style="normal" opacity="1.0">复合物 III（细胞色素 bc₁）</text>
<circle cx="340" cy="262" r="26" fill="#FFFFFF" stroke="#1F2933" stroke-width="1.8"/>
<text x="340.0" y="268.0" font-size="15" fill="#1F2933" text-anchor="middle" font-weight="600" font-style="normal" opacity="1.0">Qo</text>
<circle cx="566" cy="386" r="26" fill="#FFFFFF" stroke="#1F2933" stroke-width="1.8"/>
<text x="566.0" y="392.0" font-size="15" fill="#1F2933" text-anchor="middle" font-weight="600" font-style="normal" opacity="1.0">Qi</text>
<text x="96.0" y="256.0" font-size="17" fill="#2E7D32" text-anchor="middle" font-weight="600" font-style="normal" opacity="1.0">QH₂</text>
<text x="96.0" y="276.0" font-size="11" fill="#6B7280" text-anchor="middle" font-weight="400" font-style="normal" opacity="1.0">来自复合物 I / II</text>
<line x1="132.00" y1="262.00" x2="310.00" y2="262.00" stroke="#1F2933" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ar)"/>
<text x="812.0" y="356.0" font-size="17" fill="#2E7D32" text-anchor="middle" font-weight="600" font-style="normal" opacity="1.0">Q</text>
<text x="812.0" y="376.0" font-size="11" fill="#6B7280" text-anchor="middle" font-weight="400" font-style="normal" opacity="1.0">在 Qi 被还原</text>
<line x1="786.00" y1="372.00" x2="596.00" y2="382.00" stroke="#1F2933" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ar)"/>
<rect x="398" y="202" width="132" height="30" rx="6" fill="#FFFFFF" stroke="#B26A00" stroke-width="1.6"/>
<text x="464.0" y="222.0" font-size="12" fill="#B26A00" text-anchor="middle" font-weight="600" font-style="normal" opacity="1.0">Rieske [2Fe–2S]</text>
<line x1="558.00" y1="217.00" x2="588.00" y2="217.00" stroke="#1F2933" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ar)"/>
<path d="M358,246 C372,236 380,228 394,220" fill="none" stroke="#1F2933" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/>
<text x="372.0" y="240.0" font-size="12" fill="#6C3FC5" text-anchor="middle" font-weight="600" font-style="normal" opacity="1.0">1e⁻</text>
<rect x="590" y="202" width="80" height="30" rx="6" fill="#FFFFFF" stroke="#B26A00" stroke-width="1.6"/>
<text x="630.0" y="222.0" font-size="12" fill="#B26A00" text-anchor="middle" font-weight="600" font-style="normal" opacity="1.0">cyt c₁</text>
<circle cx="748" cy="196" r="21" fill="#FFFFFF" stroke="#2E7D32" stroke-width="2.0"/>
<text x="748.0" y="202.0" font-size="12" fill="#2E7D32" text-anchor="middle" font-weight="600" font-style="normal" opacity="1.0">cyt c</text>
<line x1="670.00" y1="214.00" x2="724.00" y2="200.00" stroke="#1F2933" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ar)"/>
<rect x="378" y="300" width="48" height="26" rx="5" fill="#FFFFFF" stroke="#1D6FD1" stroke-width="1.6"/>
<text x="402.0" y="318.0" font-size="12" fill="#1D6FD1" text-anchor="middle" font-weight="600" font-style="normal" opacity="1.0">b_L</text>
<rect x="452" y="344" width="48" height="26" rx="5" fill="#FFFFFF" stroke="#1D6FD1" stroke-width="1.6"/>
<text x="476.0" y="362.0" font-size="12" fill="#1D6FD1" text-anchor="middle" font-weight="600" font-style="normal" opacity="1.0">b_H</text>
<path d="M348,286 C358,294 366,298 376,303" fill="none" stroke="#1F2933" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/>
<text x="330.0" y="312.0" font-size="12" fill="#6C3FC5" text-anchor="middle" font-weight="600" font-style="normal" opacity="1.0">1e⁻</text>
<path d="M426,320 C436,328 442,332 450,340" fill="none" stroke="#1F2933" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/>
<path d="M500,356 C516,366 528,374 538,382" fill="none" stroke="#1F2933" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/>
<line x1="320.00" y1="242.00" x2="320.00" y2="148.00" stroke="#1D6FD1" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arB)"/>
<text x="332.0" y="144.0" font-size="13" fill="#1D6FD1" text-anchor="start" font-weight="600" font-style="normal" opacity="1.0">2H⁺ 释放到 P 侧</text>
<line x1="600.00" y1="412.00" x2="600.00" y2="470.00" stroke="#1D6FD1" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arB)"/>
<text x="612.0" y="466.0" font-size="13" fill="#1D6FD1" text-anchor="start" font-weight="600" font-style="normal" opacity="1.0">2H⁺ 从 N 侧摄取</text>
<line x1="368.00" y1="262.00" x2="424.00" y2="262.00" stroke="#C0392B" stroke-width="2.0" stroke-linecap="round" stroke-dasharray="5 4" marker-end="url(#arR)"/>
<text x="430.0" y="250.0" font-size="11" fill="#C0392B" text-anchor="start" font-weight="400" font-style="normal" opacity="1.0">半醌寿命被拉长到毫秒级</text>
<text x="430.0" y="268.0" font-size="11" fill="#C0392B" text-anchor="start" font-weight="400" font-style="normal" opacity="1.0">→ 漏电子给 O₂，生成 O₂•⁻（site IIIQo）</text>
<rect x="24" y="492" width="852" height="92" rx="10" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.2"/>
<text x="42.0" y="518.0" font-size="13" fill="#1F2933" text-anchor="start" font-weight="600" font-style="normal" opacity="1.0">一次周转的总账：</text>
<text x="42.0" y="542.0" font-size="13" fill="#1F2933" text-anchor="start" font-weight="400" font-style="normal" opacity="1.0">2 × QH₂ 在 Qo 被氧化（释放 4H⁺）＋ 1 × Q 在 Qi 被还原（摄取 2H⁺）→ 净泵出 4H⁺ / 2e⁻</text>
<text x="42.0" y="566.0" font-size="12" fill="#6B7280" text-anchor="start" font-weight="400" font-style="normal" opacity="1.0">分叉的意义：把同一个氢醌的两个电子拆成高电位与低电位两条路，才能既还原 cyt c、又还原 Q。</text>
</svg>