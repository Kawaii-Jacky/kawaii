<text x="210.0" y="315.0" font-size="20" fill="#1F2933" text-anchor="middle" font-weight="400" font-style="normal" opacity="1.0">O</text>
<text x="210.0" y="348.0" font-size="16" fill="#1F2933" text-anchor="middle" font-weight="600" font-style="normal" opacity="1.0">1,4-苯醌（对醌）</text>
<text x="210.0" y="372.0" font-size="12" fill="#6B7280" text-anchor="middle" font-weight="400" font-style="normal" opacity="1.0">两个 C=O 隔着一个 C=C：交叉共轭，可长期存放</text>
