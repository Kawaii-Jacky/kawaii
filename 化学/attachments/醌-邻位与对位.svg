<text x="610.0" y="348.0" font-size="16" fill="#C0392B" text-anchor="middle" font-weight="600" font-style="normal" opacity="1.0">1,2-苯醌（邻醌）</text>
<text x="610.0" y="372.0" font-size="12" fill="#6B7280" text-anchor="middle" font-weight="400" font-style="normal" opacity="1.0">两个 C=O 相邻：更活泼，体内多为瞬时中间体</text>
<line x1="388.00" y1="190.00" x2="444.00" y2="190.00" stroke="#6B7280" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 5"/>
