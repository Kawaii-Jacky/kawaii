<text x="420.0" y="400.0" font-size="12" fill="#B26A00" text-anchor="middle" font-weight="400" font-style="normal" opacity="1.0">邻醌电子更「挤」，被进一步氧化、聚合的倾向更强 —— 这也是它在体内只以瞬时中间体出现的原因</text>
