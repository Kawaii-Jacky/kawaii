<text x="712.0" y="264.0" font-size="12" fill="#6B7280" text-anchor="middle" font-weight="600">虚线：起偏后的振动面（0°）</text>
<text x="712.0" y="284.0" font-size="12" fill="#6B7280" text-anchor="middle" font-weight="600">实线：右旋（+）与左旋（−）</text>
<text x="24.0" y="320.0" font-size="12" fill="#B7791F" text-anchor="start" font-weight="400">α 是观测值：换成比旋光度 [α] = α /（l × c）后，才能在不同样品之间比较；正负号按观察者迎着光束看的方向定义。</text>
