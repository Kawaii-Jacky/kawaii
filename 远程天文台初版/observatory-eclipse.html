<body>
<div id="boot-status" style="position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#0A0B0E;color:#E8ECF1;font:14px system-ui;padding:24px;text-align:center">正在加载远程天文台…</div>
<div id="root"></div>
<script>
  window.ASTROY_API_BASE = window.ASTROY_API_BASE || (location.protocol + '//' + location.hostname + ':8080');
  window.ASTROY_API_KEY = window.ASTROY_API_KEY || 'dev-api-key';
  (function () {
    var panel = document.getElementById('boot-status');
    function fail(message) {
      panel.style.display = 'grid';
      panel.innerHTML = '<div><div style="color:#F87171;font-size:18px;margin-bottom:10px">页面启动失败</div><pre style="white-space:pre-wrap;text-align:left;max-width:760px">' + String(message).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]}) + '</pre><div style="color:#8088A0;margin-top:12px">请把这段错误文字发给我</div></div>';
    }
    window.addEventListener('error', function (e) { fail(e.message + '\\n' + (e.filename || '') + ':' + (e.lineno || 0)); });
    window.addEventListener('unhandledrejection', function (e) { fail(e.reason && (e.reason.stack || e.reason.message) || e.reason); });
    window.__bootDone = function () { panel.style.display = 'none'; };
    setTimeout(function () { if (!document.getElementById('root').firstElementChild) fail('React 未渲染任何内容。React=' + !!window.React + ', ReactDOM=' + !!window.ReactDOM + ', Babel=' + !!window.Babel); }, 5000);
  }());
</script>
