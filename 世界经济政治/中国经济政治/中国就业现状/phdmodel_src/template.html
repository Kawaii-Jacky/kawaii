<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三条航道的期权定价</title>
<style>
:root{
  color-scheme:light;
  --surface:#fcfcfb; --surface-2:#f3f2ee; --surface-3:#e9e7e0;
  --text-1:#0b0b0b; --text-2:#52514e; --text-3:#7a7974;
  --grid:#e4e2dc; --axis:#c9c7bf;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --accent:#2a78d6;
  --seq-1:#cde2fb; --seq-2:#9ec5f4; --seq-3:#6da7ec; --seq-4:#3987e5; --seq-5:#256abf; --seq-6:#184f95;
  --neg:#e34948; --pos:#008300;
  --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --sans:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono","Consolas","Menlo",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --surface:#1a1a19; --surface-2:#222220; --surface-3:#2c2c29;
    --text-1:#f0efec; --text-2:#c3c2b7; --text-3:#94938a;
    --grid:#2f2f2c; --axis:#4a4944;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --accent:#3987e5;
    --seq-1:#13304f; --seq-2:#184f95; --seq-3:#1c5cab; --seq-4:#2a78d6; --seq-5:#5598e7; --seq-6:#9ec5f4;
    --neg:#e66767; --pos:#3fae3f;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --surface:#1a1a19; --surface-2:#222220; --surface-3:#2c2c29;
  --text-1:#f0efec; --text-2:#c3c2b7; --text-3:#94938a;
  --grid:#2f2f2c; --axis:#4a4944;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --accent:#3987e5;
  --seq-1:#13304f; --seq-2:#184f95; --seq-3:#1c5cab; --seq-4:#2a78d6; --seq-5:#5598e7; --seq-6:#9ec5f4;
  --neg:#e66767; --pos:#3fae3f;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--surface);color:var(--text-1);font-family:var(--serif);line-height:1.85;font-size:16.5px;overflow-x:hidden}
a{color:var(--accent)}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--grid)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;height:48px;font-family:var(--sans);font-size:13px}
header.top nav{display:flex;gap:16px;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
header.top nav a{color:var(--text-2);text-decoration:none}
header.top nav a:hover{color:var(--text-1)}
.brand{font-weight:700;letter-spacing:.08em;white-space:nowrap}
#themeBtn{font:inherit;border:1px solid var(--axis);background:var(--surface-2);color:var(--text-2);border-radius:6px;padding:2px 10px;cursor:pointer}
.hero{padding:64px 0 24px;border-bottom:1px solid var(--grid)}
.hero .kick{font-family:var(--sans);font-size:12px;letter-spacing:.3em;color:var(--text-3)}
.hero h1{font-size:clamp(28px,5vw,46px);line-height:1.3;margin:12px 0 10px;font-weight:900}
.hero .sub{font-size:clamp(15px,2vw,19px);color:var(--text-2);max-width:820px}
.meta{font-family:var(--sans);font-size:13px;color:var(--text-3);margin-top:14px}
.abstract{background:var(--surface-2);border-left:3px solid var(--accent);padding:18px 22px;margin:28px 0;border-radius:0 8px 8px 0;font-size:15.5px}
.abstract b{font-family:var(--sans)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:24px 0 8px}
.tile{background:var(--surface-2);border:1px solid var(--grid);border-radius:10px;padding:14px 16px;font-family:var(--sans)}
.tile .lab{font-size:12.5px;color:var(--text-2)}
.tile .val{font-size:30px;font-weight:600;line-height:1.25;margin:4px 0}
.tile .note{font-size:12px;color:var(--text-3);line-height:1.5}
section.sec{padding:44px 0 12px;border-bottom:1px solid var(--grid)}
h2{font-size:clamp(22px,3.4vw,30px);font-weight:900;margin-bottom:6px}
h2 .no{font-family:var(--sans);font-size:.55em;color:var(--text-3);margin-right:10px;letter-spacing:.1em;vertical-align:middle}
h3{font-size:19px;margin:24px 0 6px}
p{margin:10px 0}
.lead{color:var(--text-2)}
.eq{font-family:var(--mono);font-size:14px;background:var(--surface-2);border:1px solid var(--grid);border-radius:8px;padding:12px 14px;margin:12px 0;overflow-x:auto;white-space:pre;line-height:1.7;color:var(--text-1)}
.fig{margin:18px 0 8px;background:var(--surface);border:1px solid var(--grid);border-radius:12px;padding:14px 14px 10px}
.fig .ftitle{font-family:var(--sans);font-weight:600;font-size:15px}
.fig .fsub{font-family:var(--sans);font-size:12.5px;color:var(--text-2);margin-bottom:8px}
.fig .cap{font-family:var(--sans);font-size:12px;color:var(--text-3);margin-top:6px;line-height:1.6}
.ctrl{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px;font-family:var(--sans);font-size:13px}
.ctrl button{font:inherit;border:1px solid var(--axis);background:var(--surface-2);color:var(--text-2);border-radius:999px;padding:3px 12px;cursor:pointer}
.ctrl button.on{background:var(--text-1);color:var(--surface);border-color:var(--text-1)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-family:var(--sans);font-size:12.5px;color:var(--text-2);margin:4px 0}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--sans);font-size:11px;fill:var(--text-2)}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .ax{stroke:var(--axis);stroke-width:1}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--axis);border-radius:8px;padding:8px 10px;font-family:var(--sans);font-size:12px;color:var(--text-1);box-shadow:0 4px 18px rgba(0,0,0,.12);opacity:0;transition:opacity .12s;z-index:5;min-width:150px;line-height:1.55}
.tip .k{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
table.t{width:100%;border-collapse:collapse;font-family:var(--sans);font-size:13px;margin:10px 0}
table.t th,table.t td{border-bottom:1px solid var(--grid);padding:6px 8px;text-align:right;white-space:nowrap}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t thead th{color:var(--text-2);font-weight:600;border-bottom:1px solid var(--axis)}
table.t td.best{font-weight:700}
.tscroll{overflow-x:auto}
.lab-grid{display:grid;grid-template-columns:minmax(240px,320px) 1fr;gap:18px}
@media(max-width:760px){.lab-grid{grid-template-columns:1fr}}
.slider{font-family:var(--sans);font-size:13px;margin:8px 0}
.slider label{display:flex;justify-content:space-between;color:var(--text-2)}
.slider input{width:100%}
.slider b{color:var(--text-1);font-variant-numeric:tabular-nums}
.callout{border:1px solid var(--grid);background:var(--surface-2);border-radius:10px;padding:14px 16px;margin:14px 0}
.prop{border-left:3px solid var(--text-1);padding:4px 0 4px 14px;margin:16px 0}
.prop .pn{font-family:var(--sans);font-size:12px;color:var(--text-3);letter-spacing:.15em}
.refs{font-family:var(--sans);font-size:12.5px;color:var(--text-2)}
.refs li{margin:4px 0 4px 18px}
.small{font-family:var(--sans);font-size:12.5px;color:var(--text-3)}
.tag{display:inline-block;font-family:var(--sans);font-size:11px;padding:0 6px;border-radius:4px;border:1px solid var(--axis);color:var(--text-2);margin-left:6px;vertical-align:middle}
footer{padding:40px 0 60px;font-family:var(--sans);font-size:12px;color:var(--text-3)}
</style>
</head>

  <button id="themeBtn" aria-label="切换深浅色">◐</button>
</div></header>
