# Mosquitto ACL for astroy.xyz home-IoT deployment.
# Create real passwords with mosquitto_passwd; never commit the password file.

user mppt-001
topic write devices/mppt-001/telemetry
topic write devices/mppt-001/status
topic write devices/mppt-001/reported
topic read  devices/mppt-001/command
topic read  devices/mppt-001/desired

user esp32-001
topic write devices/esp32-001/telemetry
topic write devices/esp32-001/status
topic write devices/esp32-001/reported
topic read  devices/esp32-001/command
topic read  devices/esp32-001/desired

user ef-001
topic write devices/ef-001/telemetry
topic write devices/ef-001/status
topic write devices/ef-001/reported
topic read  devices/ef-001/command
topic read  devices/ef-001/desired

# API/mqtt-worker account. Use this account only on the trusted server.
user backend-controller
topic read  devices/+/telemetry
topic read  devices/+/status
topic read  devices/+/reported
topic write devices/+/command
topic write devices/+/desired
topic read  $SYS/broker/bytes/#

# Optional read-only operations account for MQTTX diagnostics.
# Uncomment only when needed and use a separate strong password.
# user operator-readonly
# topic read devices/+/telemetry
# topic read devices/+/status
# topic read devices/+/reported
