map $http_cf_connecting_ip $astra_client_ip {
  default $http_cf_connecting_ip;
  "" $remote_addr;
}
map $http_x_forwarded_proto $astra_forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}
server {
  listen 80;
  server_name www.astroy.xyz;
  return 308 https://astroy.xyz$request_uri;
}
server {
  listen 80 default_server;
  client_max_body_size 26m;
  server_name astroy.xyz localhost _;
  server_tokens off;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
  root /usr/share/nginx/html;
  index index.html;
  location = /health {
    proxy_pass http://api:8080/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
  }
  location = /api/v1/controller/connection/auto-provision {
    proxy_pass http://admin-console:8100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $astra_client_ip;
    proxy_set_header X-Forwarded-For $astra_client_ip;
    proxy_set_header X-Forwarded-Proto $astra_forwarded_proto;
    proxy_buffering off;
    proxy_read_timeout 60s;
  }
  location /api/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $astra_client_ip;
    proxy_set_header X-Forwarded-For $astra_client_ip;
    proxy_set_header X-Forwarded-Proto $astra_forwarded_proto;
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }
  location = /admin {
    proxy_pass http://admin-console:8100/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $astra_client_ip;
    proxy_set_header X-Forwarded-For $astra_client_ip;
    proxy_set_header X-Forwarded-Proto $astra_forwarded_proto;
    proxy_buffering off;
  }
  location /admin/ {
    proxy_pass http://admin-console:8100/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $astra_client_ip;
    proxy_set_header X-Forwarded-For $astra_client_ip;
    proxy_set_header X-Forwarded-Proto $astra_forwarded_proto;
    proxy_buffering off;
  }
  location /admin-api/ {
    proxy_pass http://admin-console:8100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $astra_client_ip;
    proxy_set_header X-Forwarded-For $astra_client_ip;
    proxy_set_header X-Forwarded-Proto $astra_forwarded_proto;
    proxy_buffering off;
  }
  location ~* \.(?:webp|avif|glb)$ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }
  location = /sw.js {
    try_files $uri =404;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header CDN-Cache-Control "no-store" always;
  }
  location = /manifest.webmanifest {
    try_files $uri =404;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header CDN-Cache-Control "no-store" always;
  }
  location / { try_files $uri $uri/ /index.html; }
}
