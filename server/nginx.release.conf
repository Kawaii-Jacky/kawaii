server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  location /api/ { proxy_pass http://api:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location /admin-api/ { proxy_pass http://admin-console:8100; proxy_set_header Host $host; }
  location = /sw.js { try_files $uri =404; add_header Cache-Control "no-store, no-cache, must-revalidate" always; add_header CDN-Cache-Control "no-store" always; }
  location = /manifest.webmanifest { try_files $uri =404; add_header Cache-Control "no-store, no-cache, must-revalidate" always; add_header CDN-Cache-Control "no-store" always; }
  location / { try_files $uri $uri/ /index.html; }
}
