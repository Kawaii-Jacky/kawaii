name: ${COMPOSE_PROJECT_NAME:-astra}
services:
  mosquitto-config-init:
    image: eclipse-mosquitto:2
    restart: "no"
    user: "0:0"
    command: >-
      sh -c 'test -s /target/passwd || cp /seed/passwd /target/passwd;
      test -s /target/acl.conf || cp /seed/acl.conf /target/acl.conf;
      chown 1883:1883 /target/passwd /target/acl.conf;
      chmod 0700 /target/passwd /target/acl.conf'
    volumes:
      - ./.secrets/mosquitto.passwd:/seed/passwd:ro
      - ./mosquitto/acl.conf:/seed/acl.conf:ro
      - mosquitto-auth:/target

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-astroy}
      POSTGRES_USER: ${POSTGRES_USER:-astra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-auth:/mosquitto/dynamic-config:ro
      - mosquitto-data:/mosquitto/data
    ports:
      - "127.0.0.1:1883:1883"
      - "127.0.0.1:9001:9001"
    depends_on:
      mosquitto-config-init:
        condition: service_completed_successfully

  sms-gateway:
    image: ${ASTRA_SMS_IMAGE:-ghcr.io/kawaii-jacky/astra-sms:${ASTRA_VERSION:-latest}}
    build: { context: ., dockerfile: Dockerfile }
    command: uvicorn app.sms_gateway:app --host 0.0.0.0 --port 8090
    restart: unless-stopped
    environment:
      SMS_WEBHOOK_TOKEN: ${SMS_WEBHOOK_TOKEN:?SMS_WEBHOOK_TOKEN is required}
      SMS_GATEWAY_MODE: ${SMS_GATEWAY_MODE:-mock}
      ALIYUN_SMS_ACCESS_KEY_ID: ${ALIYUN_SMS_ACCESS_KEY_ID:-}
      ALIYUN_SMS_ACCESS_KEY_SECRET: ${ALIYUN_SMS_ACCESS_KEY_SECRET:-}
      ALIYUN_SMS_SIGN_NAME: ${ALIYUN_SMS_SIGN_NAME:-}
      ALIYUN_SMS_TEMPLATE_CODE: ${ALIYUN_SMS_TEMPLATE_CODE:-}
      ALIYUN_SMS_TEMPLATE_CODE_REGISTER: ${ALIYUN_SMS_TEMPLATE_CODE_REGISTER:-}
      ALIYUN_SMS_TEMPLATE_CODE_RECOVER: ${ALIYUN_SMS_TEMPLATE_CODE_RECOVER:-}
      ALIYUN_SMS_REGION_ID: ${ALIYUN_SMS_REGION_ID:-cn-hangzhou}
      ALIYUN_PNVS_ACCESS_KEY_ID: ${ALIYUN_PNVS_ACCESS_KEY_ID:-}
      ALIYUN_PNVS_ACCESS_KEY_SECRET: ${ALIYUN_PNVS_ACCESS_KEY_SECRET:-}
      ALIYUN_PNVS_SIGN_NAME: ${ALIYUN_PNVS_SIGN_NAME:-}
      ALIYUN_PNVS_TEMPLATE_CODE: ${ALIYUN_PNVS_TEMPLATE_CODE:-}
      ALIYUN_PNVS_SCHEME_NAME: ${ALIYUN_PNVS_SCHEME_NAME:-ASTRA}
      ALIYUN_PNVS_VALID_MINUTES: ${ALIYUN_PNVS_VALID_MINUTES:-10}
      ALIYUN_PNVS_INTERVAL_SECONDS: ${ALIYUN_PNVS_INTERVAL_SECONDS:-60}
      SMS_SEND_LIMIT: ${SMS_SEND_LIMIT:-5}
      SMS_SEND_WINDOW_SECONDS: ${SMS_SEND_WINDOW_SECONDS:-3600}
    expose: ["8090"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  service-control:
    image: ${ASTRA_CONTROL_IMAGE:-ghcr.io/kawaii-jacky/astra-control:${ASTRA_VERSION:-latest}}
    build: { context: ., dockerfile: Dockerfile.admin }
    command: python -m app.service_control
    restart: unless-stopped
    network_mode: none
    read_only: true
    environment:
      COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-astra}
      SERVICE_CONTROL_SOCKET: /run/service-control/control.sock
      RESTART_COOLDOWN_SECONDS: 30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - service-control-run:/run/service-control:rw
    healthcheck:
      test: ["CMD", "python", "-c", "import os; assert os.path.exists('/run/service-control/control.sock')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    tmpfs:
      - /tmp

  api:
    image: ${ASTRA_API_IMAGE:-ghcr.io/kawaii-jacky/astra-api:${ASTRA_VERSION:-latest}}
    build: { context: ., dockerfile: Dockerfile }
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-astra}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-astroy}
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_CONTROLLERS_FILE: /run/astra-secrets/mqtt-controllers.json
      MQTT_INTERNAL_HOST: mosquitto
      SMS_WEBHOOK_URL: http://sms-gateway:8090/send
      CREDENTIAL_VAULT_KEY_FILE: /run/astra-vault/credential-vault.key
    volumes:
      - ./.secrets/credential-vault.key:/run/astra-vault/credential-vault.key:ro
      - ./.secrets:/run/astra-secrets:ro
    depends_on:
      postgres: { condition: service_healthy }
      mosquitto: { condition: service_started }
      sms-gateway: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  admin-console:
    image: ${ASTRA_ADMIN_IMAGE:-ghcr.io/kawaii-jacky/astra-admin:${ASTRA_VERSION:-latest}}
    build: { context: ., dockerfile: Dockerfile.admin }
    command: uvicorn app.admin_console:app --host 0.0.0.0 --port 8100
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-astra}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-astroy}
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MOSQUITTO_PASSWORD_FILE: /config/passwd
      MOSQUITTO_ACL_FILE: /config/acl.conf
      SERVICE_CONTROL_SOCKET: /run/service-control/control.sock
      CREDENTIAL_VAULT_KEY_FILE: /run/astra-vault/credential-vault.key
      MQTT_CONTROLLERS_FILE: /run/astra-secrets/mqtt-controllers.json
    volumes:
      - service-control-run:/run/service-control:rw
      - ./.secrets/credential-vault.key:/run/astra-vault/credential-vault.key:ro
      - mosquitto-auth:/config:rw
      - ./.secrets:/run/astra-secrets:rw
    depends_on:
      api: { condition: service_healthy }
      postgres: { condition: service_healthy }
      mosquitto: { condition: service_started }
      service-control: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/admin-health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    image: ${ASTRA_WEB_IMAGE:-ghcr.io/kawaii-jacky/astra-web:${ASTRA_VERSION:-latest}}
    build: { context: .., dockerfile: server/Dockerfile.web }
    restart: unless-stopped
    ports:
      - "${ASTRA_WEB_PORT:-8000}:80"
    depends_on:
      api: { condition: service_healthy }
      admin-console: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  cloudflared:
    image: cloudflare/cloudflared:2025.8.0
    restart: unless-stopped
    command: tunnel --no-autoupdate --protocol http2 run --token-file /run/secrets/cloudflared.token
    profiles: [cloudflared]
    volumes:
      - ./.secrets/cloudflared.token:/run/secrets/cloudflared.token:ro
    depends_on:
      web: { condition: service_healthy }

volumes:
  postgres-data:
  mosquitto-data:
  mosquitto-auth:
  service-control-run:
