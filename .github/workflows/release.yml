name: ASTRA release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
jobs:
  pwa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Validate manifest, service worker and JavaScript
        run: |
          node -e "JSON.parse(require('fs').readFileSync('remote-observatory-frontend/manifest.webmanifest','utf8'))"
          node --check remote-observatory-frontend/app.js
          test -f remote-observatory-frontend/sw.js
          ! grep -E '(/api/|/admin-api/|/admin/)' remote-observatory-frontend/sw.js | grep 'cache.put' || exit 1
  windows:
    runs-on: windows-latest
    needs: pwa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri CLI
        run: npm install --prefix apps/astra-tauri
      - name: Build Windows EXE
        run: npx --prefix apps/astra-tauri tauri build --config apps/astra-tauri/src-tauri/tauri.conf.json
      - uses: actions/upload-artifact@v4
        with: { name: ASTRA-windows, path: apps/astra-tauri/src-tauri/target/release/bundle/nsis/*.exe }
  android:
    runs-on: ubuntu-latest
    needs: pwa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: android-actions/setup-android@v3
      - name: Install Tauri CLI
        run: npm install --prefix apps/astra-tauri
      - name: Build universal debug APK
        run: npx --prefix apps/astra-tauri tauri android build --debug
      - uses: actions/upload-artifact@v4
        with: { name: ASTRA-android, path: apps/astra-tauri/src-tauri/gen/android/app/build/outputs/apk/**/*.apk }
  docker:
    runs-on: ubuntu-latest
    needs: pwa
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with: { context: server, file: server/Dockerfile, platforms: linux/amd64,linux/arm64, push: true, tags: ghcr.io/${{ github.repository_owner }}/astra-api:${{ github.ref_name }} }
      - name: Build and push web image
        uses: docker/build-push-action@v6
        with: { context: ., file: server/Dockerfile.web, platforms: linux/amd64,linux/arm64, push: true, tags: ghcr.io/${{ github.repository_owner }}/astra-web:${{ github.ref_name }} }
