name: ASTRA release
on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pwa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate manifest, service worker and JavaScript
        run: |
          node -e "JSON.parse(require('fs').readFileSync('remote-observatory-frontend/manifest.webmanifest','utf8'))"
          node --check remote-observatory-frontend/app.js
          node --check remote-observatory-frontend/sw.js
          node -e "const h=require('fs').readFileSync('remote-observatory-frontend/index.html','utf8'); const tag=h.match(/<script[^>]+vendor\/lucide\/lucide\.min\.js[^>]*>/i)?.[0]; if(!tag) throw new Error('Bundled Lucide script tag missing'); if(/\bintegrity\s*=/.test(tag)) throw new Error('SRI blocks bundled Lucide under the Tauri asset protocol')"
          test -f remote-observatory-frontend/sw.js
          ! grep -E '(/api/|/admin-api/|/admin/)' remote-observatory-frontend/sw.js | grep 'cache.put' || exit 1
          ! grep -F 'then(() => self.skipWaiting())' remote-observatory-frontend/sw.js
      - name: Run Lighthouse smoke audit
        run: |
          cat > remote-observatory-frontend/.lighthouse-smoke.html <<'HTML'
          <!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>ASTRA PWA shell</title><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/app.css"></head><body><main><h1>ASTRA</h1><p>Progressive web application shell.</p></main></body></html>
          HTML
          python3 -m http.server 4173 --directory remote-observatory-frontend >/tmp/astra-pwa-server.log 2>&1 &
          npx --yes wait-on http://127.0.0.1:4173/
          npx --yes lighthouse http://127.0.0.1:4173/.lighthouse-smoke.html \
            --chrome-flags="--headless=new --no-sandbox --disable-dev-shm-usage" \
            --disable-javascript \
            --only-categories=accessibility,best-practices,seo \
            --output=json --output-path=lighthouse-report.json --quiet
          node -e "const r=require('./lighthouse-report.json'); if(r.runtimeError) throw new Error(r.runtimeError.message); for (const k of ['accessibility','best-practices','seo']) if(typeof r.categories[k]?.score !== 'number') throw new Error('Missing Lighthouse '+k+' score')"
      - name: Run backend regression tests
        run: |
          python -m pip install --disable-pip-version-check -r server/requirements.txt
          cd server
          python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: ASTRA-lighthouse
          path: lighthouse-report.json
  windows:
    runs-on: windows-latest
    needs: pwa
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: x86
            target: i686-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Tauri CLI
        run: npm ci --prefix apps/astra-tauri
      - name: Build Windows ${{ matrix.arch }} EXE
        working-directory: apps/astra-tauri
        run: npx tauri build --target ${{ matrix.target }}
      - name: Verify Windows ${{ matrix.arch }} runtime initialization
        shell: pwsh
        run: |
          $exe = Resolve-Path 'apps/astra-tauri/src-tauri/target/${{ matrix.target }}/release/astra.exe'
          $stdout = Join-Path $env:RUNNER_TEMP 'astra-${{ matrix.arch }}.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'astra-${{ matrix.arch }}.stderr.log'
          $info = [System.Diagnostics.ProcessStartInfo]::new()
          $info.FileName = $exe.Path
          $info.WorkingDirectory = Split-Path $exe.Path
          $info.UseShellExecute = $false
          $info.RedirectStandardOutput = $true
          $info.RedirectStandardError = $true
          $info.Environment['RUST_BACKTRACE'] = '1'
          $process = [System.Diagnostics.Process]::new()
          $process.StartInfo = $info
          if (-not $process.Start()) { throw 'ASTRA process did not start' }
          Start-Sleep -Seconds 10
          if ($process.HasExited) {
            $out = $process.StandardOutput.ReadToEnd()
            $err = $process.StandardError.ReadToEnd()
            Set-Content -LiteralPath $stdout -Value $out
            Set-Content -LiteralPath $stderr -Value $err
            throw "ASTRA exited during startup with code $($process.ExitCode).`nSTDOUT:`n$out`nSTDERR:`n$err"
          }
          Stop-Process -Id $process.Id -Force
          $process.WaitForExit(5000) | Out-Null
          $out = $process.StandardOutput.ReadToEnd()
          $err = $process.StandardError.ReadToEnd()
          Set-Content -LiteralPath $stdout -Value $out
          Set-Content -LiteralPath $stderr -Value $err
          if ("$out`n$err" -notmatch 'ASTRA_FRONTEND_HEALTH icons=lucide unresolved=0 rendered=([2-9][0-9]|[1-9][0-9]{2,})') {
            throw "ASTRA stayed open but bundled Lucide icons did not initialize.`nSTDOUT:`n$out`nSTDERR:`n$err"
          }
      - name: Name Windows ${{ matrix.arch }} installer
        shell: pwsh
        run: |
          $source = Get-ChildItem 'apps/astra-tauri/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe' | Select-Object -First 1
          if (-not $source) { throw 'Tauri did not produce an NSIS installer' }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $source.FullName "dist/ASTRA-Setup-$env:GITHUB_REF_NAME-${{ matrix.arch }}.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: ASTRA-windows-${{ matrix.arch }}
          path: dist/ASTRA-Setup-*-${{ matrix.arch }}.exe
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    needs: pwa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: android-actions/setup-android@v3
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android NDK and Rust targets
        run: |
          # The hosted image contains multiple emulator/system-image SDKs. Remove
          # them before the universal four-ABI build so Gradle has enough space.
          sudo rm -rf "$ANDROID_HOME/ndk" "$ANDROID_HOME/system-images" "$ANDROID_HOME/emulator"
          sudo rm -rf /usr/share/dotnet /opt/ghc
          df -h /
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
      - name: Install Tauri CLI
        run: npm ci --prefix apps/astra-tauri
      - name: Build universal debug APK
        working-directory: apps/astra-tauri
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2
        run: |
          npx tauri android init
          npx tauri android build --apk --debug
      - name: Name Android package
        run: |
          mkdir -p dist
          apk=$(find apps/astra-tauri/src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' | sort | head -n 1)
          test -n "$apk"
          cp "$apk" "dist/ASTRA-${GITHUB_REF_NAME}-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: ASTRA-android
          path: dist/ASTRA-*-debug.apk
          if-no-files-found: error
  docker:
    runs-on: ubuntu-latest
    needs: pwa
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: server
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/kawaii-jacky/astra-api:${{ github.ref_name }}
            ghcr.io/kawaii-jacky/astra-api:latest
      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile.web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/kawaii-jacky/astra-web:${{ github.ref_name }}
            ghcr.io/kawaii-jacky/astra-web:latest
      - name: Build and push admin image
        uses: docker/build-push-action@v6
        with:
          context: server
          file: server/Dockerfile.admin
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/kawaii-jacky/astra-admin:${{ github.ref_name }}
            ghcr.io/kawaii-jacky/astra-admin:latest
      - name: Build and push SMS image
        uses: docker/build-push-action@v6
        with:
          context: server
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/kawaii-jacky/astra-sms:${{ github.ref_name }}
            ghcr.io/kawaii-jacky/astra-sms:latest
      - name: Build and push service-control image
        uses: docker/build-push-action@v6
        with:
          context: server
          file: server/Dockerfile.admin
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/kawaii-jacky/astra-control:${{ github.ref_name }}
            ghcr.io/kawaii-jacky/astra-control:latest
  package:
    runs-on: ubuntu-latest
    needs: [windows, android, docker]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ASTRA-*
          path: dist
          merge-multiple: true
      - name: Build deployment tarball
        run: |
          mkdir -p dist
          server/deploy/package-release.sh "${GITHUB_REF_NAME:-snapshot}" "dist/astra-server-${GITHUB_REF_NAME:-snapshot}.tar.gz"
          find dist -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum | sed 's#  dist/#  #' > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ASTRA-release
          path: dist/*
          if-no-files-found: error
      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
