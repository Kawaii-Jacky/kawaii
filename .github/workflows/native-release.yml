name: ASTRA native client release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub release tag, for example v0.1.4
        required: true
        default: v0.1.9

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/astra-tauri/package-lock.json
      - name: Validate bundled frontend
        run: |
          node --check remote-observatory-frontend/app.js
          node --check remote-observatory-frontend/observatory-3d.js
          node -e "const h=require('fs').readFileSync('remote-observatory-frontend/index.html','utf8'); const tag=h.match(/<script[^>]+vendor\/lucide\/lucide\.min\.js[^>]*>/i)?.[0]; if(!tag) throw new Error('Bundled Lucide script tag missing'); if(/\bintegrity\s*=/.test(tag)) throw new Error('SRI blocks bundled Lucide under the Tauri asset protocol')"
          node -e "const h=require('fs').readFileSync('remote-observatory-frontend/index.html','utf8'); if(!/<body class=\"auth-route\">/.test(h)) throw new Error('Initial body must use the login layout'); if(!/<section class=\"page auth-page active\" id=\"page-login\"/.test(h)) throw new Error('Login page must be the initial active page'); if(/<section class=\"page active\" id=\"page-overview\"/.test(h)) throw new Error('Overview must not render before authentication')"
          node -e "const fs=require('fs'),h=fs.readFileSync('remote-observatory-frontend/index.html','utf8'),j=fs.readFileSync('remote-observatory-frontend/app.js','utf8'),c=fs.readFileSync('remote-observatory-frontend/app.css','utf8'); const block=j.match(/async function initNativeServerSettings\(\)[\s\S]*?\n  }/i)?.[0]||''; if(/clear_native_token|routeTo\(\"login\"\)/.test(block)) throw new Error('Saving native server must not clear or redirect the current session'); if(!/route === \"login\" && state\.auth\.user/.test(j)) throw new Error('Authenticated users must never remain on the login page'); if(/auth-account-summary|AUTHENTICATED SESSION|auth-enter-profile|auth-logout-all/.test(h+j)) throw new Error('Redundant authenticated-session login block must not exist'); if(!/dx < -64/.test(j)||!/astraOverlay:\"settings\"/.test(j)) throw new Error('Mobile settings drawer must support swipe/back dismissal'); if(!/\.auth-form\[hidden\]\{display:none!important\}/.test(c)) throw new Error('Authenticated login form must stay hidden')"
      - name: Validate native core-texture model
        run: |
          python3 - <<'PY'
          import json, struct
          from pathlib import Path
          path = Path('remote-observatory-frontend/assets/models/observatory-native.glb')
          raw = path.read_bytes()
          magic, version, total = struct.unpack_from('<III', raw, 0)
          assert magic == 0x46546C67 and version == 2 and total == len(raw)
          offset = 12
          document = None
          while offset < len(raw):
              length, kind = struct.unpack_from('<II', raw, offset)
              offset += 8
              chunk = raw[offset:offset + length]
              offset += length
              if kind == 0x4E4F534A:
                  document = json.loads(chunk.rstrip(b' \t\r\n\0').decode('utf-8'))
          assert document is not None
          assert 'EXT_texture_webp' not in document.get('extensionsUsed', [])
          external = [image for image in document.get('images', []) if image.get('uri')]
          assert len(external) >= 5
          assert all(image['uri'].endswith('.png') for image in external)
          assert all((path.parent / image['uri']).is_file() for image in external)
          assert all('source' in texture for texture in document.get('textures', []))
          PY

  windows:
    runs-on: windows-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: x86
            target: i686-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/astra-tauri/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/astra-tauri/src-tauri -> target
          key: windows-${{ matrix.target }}
      - name: Install Tauri CLI
        run: npm ci --prefix apps/astra-tauri
      - name: Test native error serialization
        if: matrix.arch == 'x64'
        run: cargo test --manifest-path apps/astra-tauri/src-tauri/Cargo.toml --target ${{ matrix.target }}
      - name: Build Windows ${{ matrix.arch }} installer
        working-directory: apps/astra-tauri
        run: npx tauri build --target ${{ matrix.target }}
      - name: Verify Windows ${{ matrix.arch }} runtime initialization
        shell: pwsh
        run: |
          $exe = Resolve-Path 'apps/astra-tauri/src-tauri/target/${{ matrix.target }}/release/astra.exe'
          $info = [System.Diagnostics.ProcessStartInfo]::new()
          $info.FileName = $exe.Path
          $info.WorkingDirectory = Split-Path $exe.Path
          $info.UseShellExecute = $false
          $info.RedirectStandardOutput = $true
          $info.RedirectStandardError = $true
          $process = [System.Diagnostics.Process]::new()
          $process.StartInfo = $info
          if (-not $process.Start()) { throw 'ASTRA process did not start' }
          Start-Sleep -Seconds 30
          if ($process.HasExited) {
            $out = $process.StandardOutput.ReadToEnd()
            $err = $process.StandardError.ReadToEnd()
            throw "ASTRA exited during startup with code $($process.ExitCode).`nSTDOUT:`n$out`nSTDERR:`n$err"
          }
          Stop-Process -Id $process.Id -Force
          $process.WaitForExit(5000) | Out-Null
          $out = $process.StandardOutput.ReadToEnd()
          $err = $process.StandardError.ReadToEnd()
          if ("$out`n$err" -notmatch 'ASTRA_FRONTEND_HEALTH icons=lucide unresolved=0 rendered=([2-9][0-9]|[1-9][0-9]{2,}) route=login login_visible=true model_blocking=false') {
            throw "Bundled frontend did not initialize on the non-blocking login screen.`nSTDOUT:`n$out`nSTDERR:`n$err"
          }
          if ("$out`n$err" -notmatch 'ASTRA_MODEL_HEALTH source=external-png meshes=([2-9][0-9]|[1-9][0-9]{2,}) textured=([5-9]|[1-9][0-9]+)') {
            throw "Bundled observatory model textures did not initialize.`nSTDOUT:`n$out`nSTDERR:`n$err"
          }
      - name: Name Windows installer
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $source = Get-ChildItem 'apps/astra-tauri/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe' | Select-Object -First 1
          if (-not $source) { throw 'Tauri did not produce an NSIS installer' }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $source.FullName "dist/ASTRA-Setup-$env:RELEASE_TAG-${{ matrix.arch }}.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: ASTRA-windows-${{ matrix.arch }}
          path: dist/ASTRA-Setup-*-${{ matrix.arch }}.exe
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/astra-tauri/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/astra-tauri/src-tauri -> target
          key: android-universal
      - uses: android-actions/setup-android@v3
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android NDK and Rust targets
        run: |
          sudo rm -rf "$ANDROID_HOME/ndk" "$ANDROID_HOME/system-images" "$ANDROID_HOME/emulator"
          sudo rm -rf /usr/share/dotnet /opt/ghc
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"
          rustup target add aarch64-linux-android armv7-linux-androideabi
      - name: Install Tauri CLI
        run: npm ci --prefix apps/astra-tauri
      - name: Build optimized per-ABI debug APKs
        working-directory: apps/astra-tauri
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2
        run: |
          npx tauri android init
          npm run android:sync-icons
          npx tauri android build --apk --debug --split-per-abi --target aarch64 armv7
      - name: Validate and name Android packages
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mkdir -p dist
          arm64=$(find apps/astra-tauri/src-tauri/gen/android/app/build/outputs/apk -type f -path '*/arm64/debug/*.apk' | sort | head -n 1)
          armv7=$(find apps/astra-tauri/src-tauri/gen/android/app/build/outputs/apk -type f -path '*/arm/debug/*.apk' | sort | head -n 1)
          test -n "$arm64" && test -n "$armv7"
          cp "$arm64" "dist/ASTRA-${RELEASE_TAG}-arm64-v8a-debug.apk"
          cp "$armv7" "dist/ASTRA-${RELEASE_TAG}-armeabi-v7a-debug.apk"
          max_bytes=$((200 * 1024 * 1024))
          test "$(stat -c %s "dist/ASTRA-${RELEASE_TAG}-arm64-v8a-debug.apk")" -lt "$max_bytes"
          test "$(stat -c %s "dist/ASTRA-${RELEASE_TAG}-armeabi-v7a-debug.apk")" -lt "$max_bytes"
          unzip -l "dist/ASTRA-${RELEASE_TAG}-arm64-v8a-debug.apk" | grep -q 'lib/arm64-v8a/'
          ! unzip -l "dist/ASTRA-${RELEASE_TAG}-arm64-v8a-debug.apk" | grep -Eq 'lib/(armeabi-v7a|x86|x86_64)/'
          unzip -l "dist/ASTRA-${RELEASE_TAG}-armeabi-v7a-debug.apk" | grep -q 'lib/armeabi-v7a/'
          ! unzip -l "dist/ASTRA-${RELEASE_TAG}-armeabi-v7a-debug.apk" | grep -Eq 'lib/(arm64-v8a|x86|x86_64)/'
      - uses: actions/upload-artifact@v4
        with:
          name: ASTRA-android
          path: dist/ASTRA-*-*-debug.apk
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [windows, android]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ASTRA-*
          path: dist
          merge-multiple: true
      - name: Create checksums
        run: |
          find dist -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  dist/#  #' \
            > dist/SHA256SUMS.txt
      - name: Publish native client release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ASTRA ${{ inputs.tag }}
          generate_release_notes: true
          files: dist/*
