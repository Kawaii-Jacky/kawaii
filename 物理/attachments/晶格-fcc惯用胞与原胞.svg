<text x="700.0" y="320.0" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#64748B" text-anchor="middle" font-weight="400">惯用胞 47.0 Å³ → 原胞 11.8 Å³</text>
<text x="700.0" y="364.0" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#0F766E" text-anchor="middle" font-weight="700">4 块原胞 = 1 块惯用胞</text>
<text x="470.0" y="442.0" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="10.5" fill="#64748B" text-anchor="middle" font-weight="400">青点 = 顶角原子，橙点 = 面心原子；红箭头 = 从同一顶角出发的三个原胞基矢</text>
